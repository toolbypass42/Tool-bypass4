<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bypass Tool - GTraffic</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
        min-height: 100vh;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 15% 20%, rgba(255, 20, 147, 0.25), transparent 45%),
            radial-gradient(circle at 85% 80%, rgba(0, 255, 100, 0.18), transparent 45%),
            #000;
        z-index: -1;
    }

    .container {
        width: 100%;
        max-width: 720px;
        background: rgba(10, 10, 10, 0.9);
        border: 2px solid #ff1493;
        border-radius: 18px;
        padding: 28px;
        box-shadow:
            0 0 25px rgba(255, 20, 147, 0.5),
            0 0 60px rgba(0, 255, 100, 0.15),
            inset 0 0 30px rgba(255, 20, 147, 0.08);
        backdrop-filter: blur(6px);
        animation: glowPulse 3s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
        from { box-shadow: 0 0 25px rgba(255,20,147,.4), 0 0 60px rgba(0,255,100,.1); }
        to   { box-shadow: 0 0 40px rgba(255,20,147,.7), 0 0 90px rgba(0,255,100,.25); }
    }

    h1 {
        text-align: center;
        font-size: 26px;
        background: linear-gradient(90deg, #00ff66, #ff1493, #00ff66);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shine 4s linear infinite;
        letter-spacing: 1.5px;
        margin-bottom: 6px;
    }

    @keyframes shine {
        to { background-position: 200% center; }
    }

    .subtitle {
        text-align: center;
        color: #888;
        font-size: 12px;
        margin-bottom: 22px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .section-title {
        color: #00ff66;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 12px;
        padding-left: 10px;
        border-left: 3px solid #ff1493;
    }

    .links-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 22px;
    }

    .link-chip {
        padding: 12px 10px;
        background: linear-gradient(135deg, #0a0a0a, #1a0011);
        border: 1.5px solid #00ff66;
        border-radius: 10px;
        color: #00ff66;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s ease;
        user-select: none;
        position: relative;
        overflow: hidden;
    }

    .link-chip:hover {
        border-color: #ff1493;
        color: #ff1493;
        transform: translateY(-2px);
        box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
    }

    .link-chip.active {
        background: linear-gradient(135deg, #ff1493, #00ff66);
        color: #000;
        border-color: #fff;
        box-shadow: 0 0 20px #ff1493, 0 0 30px #00ff66;
        font-weight: 800;
    }

    .link-chip.active::after {
        content: '✓';
        position: absolute;
        top: 4px;
        right: 6px;
        font-size: 12px;
        color: #000;
    }

    .url-input-wrap {
        margin-bottom: 18px;
    }

    input[type="text"] {
        width: 100%;
        padding: 14px 16px;
        background: #050505;
        border: 2px solid #00ff66;
        border-radius: 10px;
        color: #fff;
        font-size: 14px;
        outline: none;
        transition: all 0.3s;
        font-family: 'Consolas', monospace;
    }

    input[type="text"]::placeholder {
        color: #555;
        font-family: 'Segoe UI', sans-serif;
    }

    input[type="text"]:focus {
        border-color: #ff1493;
        box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
    }

    .btn-bypass {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #00ff66, #ff1493);
        background-size: 200% auto;
        border: none;
        border-radius: 12px;
        color: #000;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s;
        margin-bottom: 20px;
        position: relative;
        overflow: hidden;
    }

    .btn-bypass:hover:not(:disabled) {
        background-position: right center;
        box-shadow: 0 0 25px #ff1493, 0 0 40px #00ff66;
        transform: translateY(-2px);
    }

    .btn-bypass:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* STATUS PANEL */
    .status-panel {
        display: none;
        background: #050505;
        border: 1.5px solid #00ff66;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 16px;
        font-family: 'Consolas', monospace;
        font-size: 13px;
        box-shadow: inset 0 0 20px rgba(0, 255, 100, 0.08);
    }

    .status-panel.show { display: block; }

    .info-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px dashed rgba(255, 20, 147, 0.25);
        color: #ccc;
    }

    .info-row span:first-child { color: #ff1493; }

    .info-row span:last-child { color: #00ff66; }

    #log {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #ff1493;
        min-height: 30px;
    }

    .log-line {
        color: #00ff66;
        padding: 4px 0;
        opacity: 0;
        animation: fadeIn 0.4s forwards;
    }

    .log-line.warn { color: #ffcc00; }
    .log-line.err  { color: #ff1f1f; font-weight: 700; }
    .log-line.ok   { color: #00ff66; font-weight: 700; }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    /* ERROR BOX */
    .error-box {
        display: none;
        background: rgba(255, 0, 0, 0.08);
        border: 2px solid #ff1f1f;
        border-radius: 12px;
        padding: 18px;
        margin-top: 14px;
        color: #ff1f1f;
        font-weight: 700;
        text-align: center;
        animation: shake 0.5s;
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
    }

    .error-box.show { display: block; }

    .error-box .code {
        font-family: 'Consolas', monospace;
        font-size: 15px;
        letter-spacing: 1px;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
    }

    .result-box {
        display: none;
        background: linear-gradient(135deg, rgba(0,255,100,.08), rgba(255,20,147,.08));
        border: 2px solid #00ff66;
        border-radius: 12px;
        padding: 16px;
        margin-top: 14px;
        color: #00ff66;
        text-align: center;
        word-break: break-all;
        animation: fadeIn 0.5s forwards;
    }

    .result-box.show { display: block; }

    .result-box a {
        color: #ff1493;
        font-weight: 700;
        text-decoration: none;
        display: inline-block;
        margin-top: 8px;
        font-size: 13px;
        border-bottom: 1px dashed #ff1493;
    }

    .result-box a:hover { color: #00ff66; }

    .footer-tag {
        text-align: center;
        margin-top: 18px;
        font-size: 11px;
        color: #444;
        letter-spacing: 2px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>⚡ BYPASS TOOL ⚡</h1>
    <div class="subtitle">Green • Pink • Black Edition</div>

    <div class="section-title">Chọn link xác nhận</div>
    <div class="links-grid" id="linksGrid">
        <div class="link-chip" data-name="Gtraffic.io">Gtraffic.io</div>
        <div class="link-chip" data-name="Link4m">Link4m</div>
        <div class="link-chip" data-name="Layma.net">Layma.net</div>
        <div class="link-chip" data-name="Traffic4k.com">Traffic4k.com</div>
        <div class="link-chip" data-name="Site2s.com">Site2s.com</div>
        <div class="link-chip" data-name="Bbmkt.com">Bbmkt.com</div>
        <div class="link-chip" data-name="Ontop.link">Ontop.link</div>
    </div>

    <div class="section-title">Dán URL cần vượt link</div>
    <div class="url-input-wrap">
        <input type="text" id="urlInput" placeholder="Dán URL của web cần vượt link (https://...)">
    </div>

    <button class="btn-bypass" id="btnBypass">🚀 VƯỢT LINK</button>

    <div class="status-panel" id="statusPanel">
        <div class="info-row"><span>Thời gian</span><span id="iTime">--</span></div>
        <div class="info-row"><span>IP thiết bị</span><span id="iIP">--</span></div>
        <div class="info-row"><span>Thiết bị</span><span id="iDev">--</span></div>
        <div class="info-row"><span>Trạng thái</span><span id="iStatus">Sẵn sàng</span></div>
        <div id="log"></div>
    </div>

    <div class="error-box" id="errorBox">
        <div class="code" id="errorText"></div>
    </div>

    <div class="result-box" id="resultBox">
        <div>✅ Vượt link thành công! Link tải:</div>
        <a id="resultLink" href="#" target="_blank"></a>
    </div>

    <div class="footer-tag">© BYPASS SYSTEM • SECURE MODE</div>
</div>

<script>
(function () {
    // ====== CẤU HÌNH ======
    const ERROR_RATE_404 = 0.15;      // 15% lỗi 404
    const ERROR_RATE_NET = 0.85;      // 85% lỗi kết nối (chỉ tính khi không phải dạng hợp lệ)
    const WAIT_SECONDS = 15;

    // Map URL hợp lệ -> link trả về
    const VALID_MAP = {
        'https://layma.net/5ABkvpfQu':
            'https://www.mediafire.com/file/msusgfxw3xosdpl/AimLock+Bro.zip/file',
        'https://link4m.net/eYerc':
            'https://www.mediafire.com/file/yqefvmq4mefu7h5/Minecraft_PE_26.30_BANDISHARE.apk/file',
        'https://bbmkts.com/go/Hfz47hy5':
            'https://www.mediafire.com/file/i5eioodkjudzmty/hackff+menuFFM.zip/file',
        'https://gtraffic.io/Yv2QaKD':
            'https://pastefy.app/bbSrxKOk/raw'
    };

    // ====== DOM ======
    const chips = document.querySelectorAll('.link-chip');
    const urlInput = document.getElementById('urlInput');
    const btnBypass = document.getElementById('btnBypass');
    const statusPanel = document.getElementById('statusPanel');
    const logBox = document.getElementById('log');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');
    const resultBox = document.getElementById('resultBox');
    const resultLink = document.getElementById('resultLink');
    const iTime = document.getElementById('iTime');
    const iIP = document.getElementById('iIP');
    const iDev = document.getElementById('iDev');
    const iStatus = document.getElementById('iStatus');

    // ====== CHỌN CHIP ======
    chips.forEach(c => {
        c.addEventListener('click', () => {
            c.classList.toggle('active');
        });
    });

    // ====== RANDOM IP + DEVICE ======
    function randomIP() {
        return [1,2,3,4].map(() => Math.floor(Math.random() * 255)).join('.');
    }
    function deviceInfo() {
        const ua = navigator.userAgent;
        let os = 'Unknown';
        if (/Windows/i.test(ua)) os = 'Windows';
        else if (/Android/i.test(ua)) os = 'Android';
        else if (/iPhone|iPad/i.test(ua)) os = 'iOS';
        else if (/Mac/i.test(ua)) os = 'macOS';
        else if (/Linux/i.test(ua)) os = 'Linux';
        const browser = /Chrome/i.test(ua) ? 'Chrome' :
                        /Firefox/i.test(ua) ? 'Firefox' :
                        /Safari/i.test(ua) ? 'Safari' : 'Browser';
        return `${os} • ${browser}`;
    }

    // ====== IN LOG TỪNG DÒNG ======
    function pushLog(text, type = '') {
        const div = document.createElement('div');
        div.className = 'log-line ' + type;
        div.textContent = '> ' + text;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function wait(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    // ====== RESET UI ======
    function resetUI() {
        logBox.innerHTML = '';
        errorBox.classList.remove('show');
        resultBox.classList.remove('show');
        errorText.textContent = '';
        resultLink.textContent = '';
        resultLink.href = '#';
        iStatus.textContent = 'Sẵn sàng';
        iStatus.style.color = '#00ff66';
    }

    // ====== CHECK DẠNG URL HỢP LỆ ======
    function isValidFormat(url) {
        return /^https:\/\/.+/i.test(url.trim());
    }

    // ====== NÚT BYPASS ======
    btnBypass.addEventListener('click', async () => {
        const url = urlInput.value.trim();

        resetUI();

        if (!url) {
            errorBox.classList.add('show');
            errorText.textContent = 'Vui lòng dán URL cần vượt link!';
            errorText.style.color = '#ff1f1f';
            return;
        }

        if (!isValidFormat(url)) {
            // Sai dạng → không tính tỷ lệ
            errorBox.classList.add('show');
            errorText.textContent = 'URL không hợp lệ! Chỉ chấp nhận dạng https://';
            errorText.style.color = '#ff1f1f';
            return;
        }

        // Hiển thị panel trạng thái
        btnBypass.disabled = true;
        statusPanel.classList.add('show');
        iTime.textContent = new Date().toLocaleString('vi-VN');
        iIP.textContent = randomIP();
        iDev.textContent = deviceInfo();
        iStatus.textContent = 'Đang kiểm tra kết nối...';

        // Kiểm tra URL có nằm trong danh sách hợp lệ không
        const isKnown = Object.prototype.hasOwnProperty.call(VALID_MAP, url);

        // Nếu KHÔNG phải link đúng dạng → áp dụng tỷ lệ lỗi
        if (!isKnown) {
            // roll: 15% lỗi 404, 85% lỗi kết nối
            const roll = Math.random();
            const is404 = roll < ERROR_RATE_404;
            await runSequenceFake(is404);
            btnBypass.disabled = false;
            return;
        }

        // ====== URL HỢP LỆ TRONG DANH SÁCH ======
        await runSequenceValid(VALID_MAP[url]);
        btnBypass.disabled = false;
    });

    // ====== LUỒNG LỖI (URL không đúng dạng nhưng đúng https://) ======
    async function runSequenceFake(is404) {
        // Đếm ngược 15 giây
        await countdownAndStatus();

        // Chạy vài bước log ngắn
        pushLog('Đang kiểm tra kết nối...');
        await wait(400);

        if (is404) {
            pushLog('Lỗi xác thực máy chủ!', 'err');
            iStatus.textContent = 'Lỗi 404';
            iStatus.style.color = '#ff1f1f';
            errorBox.classList.add('show');
            errorText.textContent = 'Web ghi error 404 do not accept this action';
            errorText.style.color = '#ff1f1f';
        } else {
            pushLog('Mất kết nối thiết bị...', 'err');
            iStatus.textContent = 'Lỗi kết nối';
            iStatus.style.color = '#ff1f1f';
            errorBox.classList.add('show');
            errorText.textContent = 'Lỗi kết nối thiết bị. Vui lòng kiểm tra kết nối mạng của bạn';
            errorText.style.color = '#ff1f1f';
        }
    }

    // ====== LUỒNG HỢP LỆ (link đúng trong danh sách) ======
    async function runSequenceValid(linkResult) {
        await countdownAndStatus();

        // Chạy chuỗi trạng thái
        const steps = [
            ['Đang tải module...', 700],
            ['Tải module hoàn tất!', 500, 'ok'],
            ['Đang giả lập bypass...', 900],
            ['Bỏ qua xác thực...', 700],
            ['Đang xác nhận...', 700],
            ['Bypass thành công!', 500, 'ok'],
            ['Bạn đã vượt qua giới hạn!', 500, 'ok']
        ];

        for (const [text, delay, type] of steps) {
            iStatus.textContent = text;
            pushLog(text, type || '');
            await wait(delay);
        }

        iStatus.textContent = 'Hoàn tất';
        iStatus.style.color = '#00ff66';

        // Hiển thị kết quả
        resultBox.classList.add('show');
        resultLink.textContent = linkResult;
        resultLink.href = linkResult;
    }

    // ====== ĐẾM 15S VỚI LOG "ĐANG KIỂM TRA" ======
    async function countdownAndStatus() {
        iStatus.textContent = 'Đang kiểm tra kết nối...';
        pushLog('Đang kiểm tra kết nối...');

        for (let i = WAIT_SECONDS; i > 0; i--) {
            iTime.textContent = new Date().toLocaleString('vi-VN');
            // đổi dòng cuối để hiển thị đếm ngược
            const last = logBox.lastElementChild;
            if (last) last.textContent = '> Vui lòng chờ... ' + i + 's';
            await wait(1000);
        }
        // sau khi xong, đổi lại dòng "Kết nối thành công!"
        const last = logBox.lastElementChild;
        if (last) {
            last.textContent = '> Kết nối thành công!';
            last.classList.add('ok');
        }
        iStatus.textContent = 'Kết nối thành công!';
    }
})();
</script>
</body>
</html>
